<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salas | Chat privado con código</title>
<meta name="description" content="Chat privado por salas con código: mensajes, voz, fotos, video y llamadas.">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f9;--pn:#fff;--tx:#161823;--mu:#6b7085;--ac:#6c5ce7;--bd:#e3e5ee;--me:var(--ac);--mt:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e0f15;--pn:#181a24;--tx:#eceef7;--mu:#8d92a8;--bd:#272a38;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0e0f15;--pn:#181a24;--tx:#eceef7;--mu:#8d92a8;--bd:#272a38;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.4 Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
h1,h2,h3{font-family:Sora,system-ui,sans-serif;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--ac);color:#fff;transition:transform .15s,opacity .15s}
button:hover{transform:translateY(-1px)}button.g{background:var(--pn);color:var(--tx);border:1px solid var(--bd)}
input[type=text]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--pn)}
.app{height:100%;display:flex;flex-direction:column;max-width:900px;margin:auto;background:var(--bg)}
.bar{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--pn);border-bottom:1px solid var(--bd)}
.bar h2{flex:1;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:38px;height:38px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:600;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.pad{padding:16px;overflow:auto;flex:1}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 2px 10px #0000000d}
.card b{display:block}.card small,.mu{color:var(--mu)}
.row{display:flex;gap:8px;margin-bottom:10px}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background-size:cover}
.m{display:flex;gap:8px;max-width:86%}.m.me{align-self:flex-end;flex-direction:row-reverse}
.b{background:var(--pn);border:1px solid var(--bd);padding:8px 12px;border-radius:16px;min-width:0;word-wrap:break-word}
.me .b{background:var(--me);color:var(--mt);border-color:transparent}
.b small{display:block;opacity:.7;font-size:12px}
.b img,.b video{max-width:100%;border-radius:12px;display:block;margin-top:4px;max-height:280px}
.b audio{max-width:100%;margin-top:4px}
.comp{display:flex;gap:6px;padding:10px;background:var(--pn);border-top:1px solid var(--bd);align-items:center}
.comp input[type=text]{flex:1}.ic{padding:10px;width:42px;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.ic.rec{background:#e5484d;color:#fff}
.hide{display:none!important}
.call{position:fixed;inset:0;background:#000d;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.call video{width:100%;max-width:560px;border-radius:18px;background:#111;max-height:55vh}
.call #lv{max-width:160px}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}.sw i{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent}.sw i.on{border-color:var(--tx)}
label{display:block;font-weight:500;margin:12px 0 4px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="app" id="app"></div>
<div class="call hide" id="call"><div id="cmsg" style="color:#fff"></div><video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video><div class="row"><button id="acc" class="hide">Contestar</button><button id="bye" style="background:#e5484d">Colgar</button></div></div>
<script>
const $=s=>document.querySelector(s);
const L={g(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const COLORS=['#6c5ce7','#00a884','#e5484d','#f59f00','#0ea5e9','#d6409f'];
const BGS={liso:'',aurora:'linear-gradient(160deg,#6c5ce744,#0ea5e944)',atardecer:'linear-gradient(160deg,#f59f0044,#d6409f44)',bosque:'linear-gradient(160deg,#00a88444,#0e2f4444)'};
let P=L.g('perfil',{name:'',av:'',ac:COLORS[0],theme:'auto',bg:'liso',uid:'u'+Math.random().toString(36).slice(2,10)});
let rooms=L.g('salas',[]),cur=null,db=null,unsub=null,rm=null;
const h=(t,a={},...k)=>{const e=document.createElement(t);for(const x in a){if(x==='on')for(const ev in a.on)e.addEventListener(ev,a.on[ev]);else if(x==='class')e.className=a[x];else e[x]=a[x]}k.flat().forEach(c=>e.append(c))
return e};
const save=()=>L.s('perfil',P),saveR=()=>L.s('salas',rooms);
function theme(){const r=document.documentElement;r.style.setProperty('--ac',P.ac);P.theme==='auto'?r.removeAttribute('data-theme'):r.dataset.theme=P.theme}
const ini=n=>(n||'?').trim()[0].toUpperCase();
const avatar=(src,n)=>{const d=h('div',{class:'av'});src?d.append(h('img',{src})):d.textContent=ini(n);return d};
function shrink(file,px,q){return new Promise(res=>{const i=new Image();i.onload=()=>{const s=Math.min(1,px/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};i.src=URL.createObjectURL(file)})}
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});

/* ---- pantallas ---- */
function home(){
  if(unsub){unsub();unsub=null}cur=null;const a=$('#app');a.replaceChildren();
  const code=h('input',{type:'text',placeholder:'Código de sala',maxLength:12});
  const nm=h('input',{type:'text',placeholder:'Nombre para una sala nueva'});
  const err=h('div',{class:'mu'});
  a.append(h('div',{class:'bar'},avatar(P.av,P.name),h('h2',{},'Hola, '+(P.name||'invitado')),h('button',{class:'g',on:{click:settings}},'Estilo')),
  h('div',{class:'pad'},
    h('h3',{style:'margin-bottom:10px'},'Mis salas'),
    ...(rooms.length?rooms.map(r=>h('div',{class:'card',on:{click:()=>open(r)}},h('div',{class:'av'},ini(r.name)),h('div',{},h('b',{},r.name),h('small',{},'Código '+r.code)))):[h('p',{class:'mu'},'Aún no tiene salas. Cree una o entre con un código.')]),
    h('h3',{style:'margin:18px 0 8px'},'Unirse con código'),
    h('div',{class:'row'},code,h('button',{on:{click:async()=>{const c=code.value.trim().toUpperCase();if(!c)return;err.textContent='Buscando…';try{const d=await db.doc('rooms/'+c).get();if(!d.exists){err.textContent='Código no válido.';return}const r={code:c,name:d.data().name};if(!rooms.find(x=>x.code===c)){rooms.push(r);saveR()}open(r)}catch(e){err.textContent='No se pudo comprobar el código.'}}}},'Entrar')),err,
    h('h3',{style:'margin:18px 0 8px'},'Crear sala'),
    h('div',{class:'row'},nm,h('button',{on:{click:async()=>{const c=Math.random().toString(36).slice(2,8).toUpperCase(),r={code:c,name:nm.value.trim()||'Sala '+c};try{await db.doc('rooms/'+c).set({name:r.name,t:Date.now()});rooms.push(r);saveR();open(r)}catch(e){err.textContent='No se pudo crear la sala.'}}}},'Crear')),
    h('p',{class:'mu'},'Solo ve las salas que creó o a las que entró con el código.')))}
function settings(){
  const a=$('#app');a.replaceChildren();const n=h('input',{type:'text',value:P.name,placeholder:'Su nombre'});
  const sw=h('div',{class:'sw'},COLORS.map(c=>h('i',{style:'background:'+c,className:c===P.ac?'on':'',on:{click:e=>{P.ac=c;save();theme();[...sw.children].forEach(x=>x.className='');e.target.className='on'}}})));
  const th=h('select',{on:{change:e=>{P.theme=e.target.value;save();theme()}}},['auto|Automático','dark|Oscuro','light|Claro'].map(o=>{const[v,t]=o.split('|');return h('option',{value:v,textContent:t,selected:v===P.theme})}));
  const bg=h('select',{on:{change:e=>{P.bg=e.target.value;save()}}},Object.keys(BGS).map(k=>h('option',{value:k,textContent:k,selected:k===P.bg})));
  const f=h('input',{type:'file',accept:'image/*',className:'hide',on:{change:async e=>{if(e.target.files[0]){P.av=await shrink(e.target.files[0],96,.7);save();settings()}}}});
  a.append(h('div',{class:'bar'},h('button',{class:'g',on:{click:()=>{P.name=n.value.trim();save();home()}}},'←'),h('h2',{},'Su estilo')),
  h('div',{class:'pad'},h('div',{class:'row',style:'align-items:center'},avatar(P.av,P.name),h('button',{class:'g',on:{click:()=>f.click()}},'Cambiar foto'),f),
  h('label',{},'Nombre'),n,h('label',{},'Color'),sw,h('label',{},'Tema'),th,h('label',{},'Fondo del chat'),bg))}
function open(r){
  cur=r;const a=$('#app');a.replaceChildren();
  const box=h('div',{id:'msgs',style:'background-image:'+(BGS[P.bg]||'none')});
  const txt=h('input',{type:'text',placeholder:'Escriba un mensaje',on:{keydown:e=>{if(e.key==='Enter')send()}}});
  const send=async()=>{const v=txt.value.trim();if(!v)return;txt.value='';post({type:'text',body:v})};
  const file=h('input',{type:'file',accept:'image/*',className:'hide',on:{change:async e=>{if(e.target.files[0])post({type:'img',body:await shrink(e.target.files[0],720,.6)});e.target.value=''}}});
  const mic=rec('audio','🎤',15000,{audioBitsPerSecond:24000});const cam=rec('video','🎥',5000,{videoBitsPerSecond:200000,audioBitsPerSecond:24000});
  a.append(h('div',{class:'bar'},h('button',{class:'g',on:{click:home}},'←'),h('h2',{},r.name+' · '+r.code),h('button',{class:'g',title:'Llamada',on:{click:()=>call(false)}},'📞'),h('button',{class:'g',title:'Videollamada',on:{click:()=>call(true)}},'📹')),box,
  h('div',{class:'comp'},h('button',{class:'ic',on:{click:()=>file.click()}},'🖼'),file,mic,cam,txt,h('button',{on:{click:send}},'➤')));
  if(unsub)unsub();
  unsub=db.collection('rooms/'+r.code+'/msgs').orderBy('t').limit(150).onSnapshot(s=>{box.replaceChildren();s.docs.forEach(d=>box.append(bubble(d.data())));box.scrollTop=box.scrollHeight},()=>{});
  function rec(kind,label,ms,opt){const b=h('button',{class:'ic',title:kind==='audio'?'Nota de voz':'Video corto (5 s)'},label);let mr=null;
    b.onclick=async()=>{if(mr){mr.stop();return}
      try{const st=await navigator.mediaDevices.getUserMedia(kind==='audio'?{audio:true}:{audio:true,video:true}),ch=[];mr=new MediaRecorder(st,opt);
        mr.ondataavailable=e=>ch.push(e.data);b.classList.add('rec');const t=setTimeout(()=>mr&&mr.stop(),ms);
        mr.onstop=async()=>{clearTimeout(t);st.getTracks().forEach(x=>x.stop());b.classList.remove('rec');const bl=new Blob(ch,{type:mr.mimeType});mr=null;const d=await b64(bl);
          if(d.length>230000){alert('El archivo es demasiado largo. Intente algo más corto.');return}post({type:kind,body:d})};mr.start()}
      catch(e){mr=null;alert('No hay permiso para usar el micrófono o la cámara.')}}
    return b}}
function post(m){if(!cur)return;db.collection('rooms/'+cur.code+'/msgs').add({...m,t:Date.now(),uid:P.uid,name:P.name||'Invitado',av:P.av}).catch(()=>alert('No se pudo enviar. El archivo puede ser muy pesado.'))}
function bubble(m){const me=m.uid===P.uid;let c;
  if(m.type==='img')c=h('img',{src:m.body});else if(m.type==='audio')c=h('audio',{src:m.body,controls:true});else if(m.type==='video')c=h('video',{src:m.body,controls:true,playsInline:true});else c=h('span',{},m.body);
  return h('div',{class:'m'+(me?' me':'')},avatar(m.av,m.name),h('div',{class:'b'},h('small',{},m.name),c))}

/* ---- llamadas (WebRTC, señal por la sala) ---- */
let pc=null,ls=null,pend=[],offer=null;
const cs=t=>{$('#call').classList.remove('hide');$('#cmsg').textContent=t};
async function media(v){ls=await navigator.mediaDevices.getUserMedia({audio:true,video:v});$('#lv').srcObject=ls;$('#lv').style.display=v?'':'none'}
function mk(){pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});ls.getTracks().forEach(t=>pc.addTrack(t,ls));
  pc.onicecandidate=e=>e.candidate&&rm.emit('sig',{k:'ice',c:e.candidate});pc.ontrack=e=>{$('#rv').srcObject=e.streams[0];cs('En llamada')};
  pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState))end(false,'La llamada terminó')}}
async function joinRoom(){if(rm)return;rm=await Claude_room().join('call-'+cur.code);
  rm.on('sig',async m=>{if(m.isMe)return;const d=m.data;
    if(d.k==='offer'){offer=d;cs((d.v?'Videollamada':'Llamada')+' entrante');$('#acc').classList.remove('hide')}
    else if(d.k==='answer'&&pc){await pc.setRemoteDescription(d.sdp);pend.forEach(c=>pc.addIceCandidate(c));pend=[]}
    else if(d.k==='ice'){pc&&pc.remoteDescription?pc.addIceCandidate(d.c):pend.push(d.c)}
    else if(d.k==='bye')end(false,'La otra persona colgó')})}
async function call(v){try{await joinRoom();await media(v);mk();const o=await pc.createOffer();await pc.setLocalDescription(o);cs('Llamando…');$('#acc').classList.add('hide');rm.emit('sig',{k:'offer',sdp:o,v})}catch(e){end(false,'');alert('No se pudo iniciar la llamada.')}}
$('#acc').onclick=async()=>{try{$('#acc').classList.add('hide');await media(offer.v);mk();await pc.setRemoteDescription(offer.sdp);pend.forEach(c=>pc.addIceCandidate(c));pend=[];const a=await pc.createAnswer();await pc.setLocalDescription(a);rm.emit('sig',{k:'answer',sdp:a})}catch(e){end(true,'')}};
$('#bye').onclick=()=>end(true);
function end(tell,msg){if(tell&&rm)rm.emit('sig',{k:'bye'});pc&&pc.close();pc=null;ls&&ls.getTracks().forEach(t=>t.stop());ls=null;pend=[];offer=null;$('#rv').srcObject=null;$('#call').classList.add('hide');if(msg)alert(msg)}
function Claude_room(){return window.__room}

/* ---- arranque ---- */
theme();
$('#app').append(h('div',{class:'pad'},h('p',{class:'mu'},'Conectando…')));
(async()=>{
  let tries=0;const iv=setInterval(()=>{if(++tries>12){clearInterval(iv);if(!db)$('#app').replaceChildren(h('div',{class:'pad'},h('h3',{},'Necesita iniciar sesión en Claude para usar las salas.')))}},1000);
  try{db=await claude.use('db');const u=await claude.use('user');window.__room=await claude.use('room');if(u){try{P.uid=await u.id()}catch(e){}}clearInterval(iv)}catch(e){}
  if(!db)return;save();
  if(!P.name){settings()}else home();
})();
</script></body></html>
