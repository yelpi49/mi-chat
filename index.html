
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Chat</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10131c;
      color: #f1f5f9;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .chat {
      width: 100%;
      max-width: 650px;
      height: 80vh;
      min-height: 400px;
      display: flex;
      flex-direction: column;
      background: #1b2030;
      border: 1px solid #343b50;
      border-radius: 16px;
      overflow: hidden;
    }

    header {
      padding: 20px;
      background: #242b40;
      border-bottom: 1px solid #343b50;
    }

    h1 { margin: 0 0 6px; font-size: 23px; }
    header p { margin: 0; color: #aab5ca; font-size: 14px; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
    }

    .welcome {
      color: #aab5ca;
      text-align: center;
      margin-top: 35px;
    }

    form {
      display: flex;
      gap: 8px;
      padding: 14px;
      border-top: 1px solid #343b50;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 13px;
      border: 1px solid #424b64;
      border-radius: 9px;
      background: #101522;
      color: white;
      font-size: 15px;
    }

    button {
      padding: 0 18px;
      border: 0;
      border-radius: 9px;
      background: #6878f5;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .message { margin: 0 0 14px; overflow-wrap: anywhere; }
    .message strong { color: #a9b4ff; }
    .message p { margin: 5px 0 0; }

    @media (max-width: 480px) {
      .chat { height: 88vh; }
      form { padding: 10px; }
      button { padding: 0 12px; }
    }
  </style>
</head>
<body>
  <main class="chat">
    <header>
      <h1>💬 Mi Chat</h1>
      <p>Un lugar para hablar con todos</p>
    </header>

    <section id="messages" aria-live="polite">
      <p class="welcome" id="welcome">
        ¡Bienvenido! Escribí el primer mensaje.
      </p>
    </section>

    <form id="chatForm">
      <input id="messageInput"
        placeholder="Escribí un mensaje..."
        maxlength="500" autocomplete="off" required>
      <button type="submit">Enviar</button>
    </form>
  </main>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) return;

      welcome?.remove();

      const item = document.createElement("article");
      item.className = "message";

      const name = document.createElement("strong");
      name.textContent = "Vos";

      const content = document.createElement("p");
      content.textContent = text;

      item.append(name, content);
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;

      input.value = "";
      input.focus();
    });
  </script>
</body>
</html>
