
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Chat Público</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --accent: #6878f5;
      --page: #10131c;
      --panel: #1b2030;
      --header: #242b40;
      --border: #343b50;
      --text: #f1f5f9;
      --muted: #aab5ca;
      --input-bg: #101522;
      --bubble: #292f43;
    }

    body.light {
      --page: #edf1f8;
      --panel: #ffffff;
      --header: #e1e8f5;
      --border: #ccd4e3;
      --text: #20283a;
      --muted: #5c667a;
      --input-bg: #ffffff;
      --bubble: #e9edf7;
    }

    body {
      margin: 0;
      padding: 16px;
      background: var(--page);
      color: var(--text);
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      transition: background .2s, color .2s;
    }

    .chat {
      width: 100%;
      max-width: 650px;
      height: 90vh;
      min-height: 400px;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    header {
      padding: 16px;
      background: var(--header);
    }

    h1 { margin: 0 0 6px; font-size: 23px; }

    header p { margin: 0; color: var(--muted); }

    #status {
      font-size: 13px;
      margin-top: 8px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    #status.error { color: #ff7777; }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    button, select, input { font: inherit; }

    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 9px;
      background: var(--accent);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    button.secondary {
      background: var(--bubble);
      color: var(--text);
      border: 1px solid var(--border);
    }

    #settings {
      padding: 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: grid;
      gap: 12px;
      max-height: 40vh;
      overflow-y: auto;
    }

    #settings[hidden] { display: none; }

    .setting { display: grid; gap: 6px; }

    .setting label, .setting-title {
      font-size: 14px;
      font-weight: bold;
    }

    .setting small {
      color: var(--muted);
      line-height: 1.4;
    }

    input, select {
      min-width: 0;
      width: 100%;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--input-bg);
      color: var(--text);
    }

    input[type="color"] {
      height: 44px;
      padding: 4px;
      cursor: pointer;
    }

    input[type="file"] { font-size: 13px; }

    .profile-preview {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      min-width: 38px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--accent);
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      overflow: hidden;
    }

    .avatar.large {
      width: 64px;
      height: 64px;
      min-width: 64px;
      font-size: 20px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background-color: transparent;
      background-image: none;
    }

    #messages.bg-gradient {
      background-image: linear-gradient(
        135deg,
        color-mix(in srgb, var(--accent) 10%, transparent),
        transparent 65%
      );
    }

    #messages.bg-dots {
      background-image: radial-gradient(
        color-mix(in srgb, var(--muted) 25%, transparent) 1px,
        transparent 1px
      );
      background-size: 18px 18px;
    }

    .message {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 14px;
      overflow-wrap: anywhere;
    }

    .message-body {
      min-width: 0;
      max-width: calc(100% - 48px);
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--bubble);
      border: 1px solid var(--border);
    }

    .message strong {
      color: var(--accent);
      overflow-wrap: anywhere;
    }

    .message p {
      margin: 5px 0 0;
      white-space: pre-wrap;
      line-height: 1.4;
    }

    #messages.bubbles-rounded .message-body {
      border-radius: 22px;
    }

    #messages.bubbles-square .message-body {
      border-radius: 4px;
    }

    .controls {
      padding: 12px;
      border-top: 1px solid var(--border);
    }

    #profileLine {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 8px;
    }

    #profileLine .avatar {
      width: 32px;
      height: 32px;
      min-width: 32px;
    }

    form {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    #messageInput { flex: 1; }

    @media (max-width: 480px) {
      body { padding: 6px; }

      .chat {
        height: 94vh;
        min-height: 350px;
        border-radius: 12px;
      }

      header { padding: 13px; }
      h1 { font-size: 21px; }
      #messages { padding: 12px; }
      .controls { padding: 9px; }
      form { gap: 6px; }
      form button { padding: 0 12px; }
    }
  </style>
</head>

<body>
  <main class="chat">
    <header>
      <h1>💬 Mi Chat</h1>
      <p>Un lugar para hablar con todos</p>
      <div id="status">Conectando...</div>

      <div class="top-actions">
        <button id="themeButton" type="button">
          ☀️ Modo claro
        </button>

        <button id="settingsButton" class="secondary"
          type="button" aria-expanded="false">
          ⚙️ Personalizar
        </button>
      </div>
    </header>

    <section id="settings" hidden>
      <div class="setting">
        <span class="setting-title">Tu perfil</span>

        <div class="profile-preview">
          <img id="profilePreview" class="avatar large"
            alt="Vista previa de tu foto de perfil">

          <div>
            <strong id="profileName">Tu nombre</strong>
            <small style="display:block">
              Así te verán los demás en tus mensajes nuevos.
            </small>
          </div>
        </div>
      </div>

      <div class="setting">
        <label for="photoInput">📸 Foto de perfil</label>

        <input id="photoInput" type="file"
          accept="image/jpeg,image/png,image/webp">

        <small>
          Formatos JPG, PNG y WebP. Máximo 5 MB.
          La foto se reduce automáticamente y se guarda
          junto con tus mensajes.
        </small>

        <button id="removePhoto" type="button"
          class="secondary">Quitar foto</button>
      </div>

      <div class="setting">
        <label for="colorInput">🎨 Color principal</label>
        <input id="colorInput" type="color" value="#6878f5">
      </div>

      <div class="setting">
        <label for="backgroundSelect">🖼️ Fondo del chat</label>

        <select id="backgroundSelect">
          <option value="plain">Simple</option>
          <option value="gradient">Degradado</option>
          <option value="dots">Puntos</option>
        </select>
      </div>

      <div class="setting">
        <label for="bubbleSelect">💬 Estilo de burbujas</label>

        <select id="bubbleSelect">
          <option value="normal">Normal</option>
          <option value="rounded">Redondeadas</option>
          <option value="square">Cuadradas</option>
        </select>
      </div>

      <button id="resetSettings" type="button"
        class="secondary">Restablecer personalización</button>
    </section>

    <section id="messages" aria-live="polite"></section>

    <div class="controls">
      <div id="profileLine">
        <img id="currentAvatar" class="avatar"
          alt="Tu foto de perfil">

        <input id="username" maxlength="24"
          placeholder="Tu nombre" autocomplete="nickname">
      </div>

      <form id="chatForm">
        <input id="messageInput" maxlength="500"
          placeholder="Escribí un mensaje..."
          autocomplete="off" required>

        <button id="sendButton" type="submit">Enviar</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const URL_SUPABASE =
      "https://xluskazgonjpchcgdzii.supabase.co";

    const CLAVE_PUBLICA =
      "sb_publishable_pWiC1tR_43vVjF0snbXeBA_tTp-0pmk";

    const statusBox = document.getElementById("status");
    const messagesBox = document.getElementById("messages");
    const nameInput = document.getElementById("username");
    const input = document.getElementById("messageInput");
    const form = document.getElementById("chatForm");
    const sendButton = document.getElementById("sendButton");

    const settings = document.getElementById("settings");
    const settingsButton = document.getElementById("settingsButton");
    const themeButton = document.getElementById("themeButton");
    const colorInput = document.getElementById("colorInput");
    const backgroundSelect =
      document.getElementById("backgroundSelect");
    const bubbleSelect = document.getElementById("bubbleSelect");
    const photoInput = document.getElementById("photoInput");
    const profilePreview = document.getElementById("profilePreview");
    const currentAvatar = document.getElementById("currentAvatar");
    const profileName = document.getElementById("profileName");

    const DEFAULT_AVATAR =
      "data:image/svg+xml;charset=UTF-8," +
      encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80">' +
        '<rect width="80" height="80" rx="40" fill="#6878f5"/>' +
        '<text x="40" y="53" text-anchor="middle" font-size="38" fill="white">?</text>' +
        '</svg>'
      );

    const AVATAR_SIZE = 128;
    const MAX_AVATAR_LENGTH = 60000;

    let profilePhoto = "";
    let client = null;
    let channel = null;
    let loadingMessages = false;

    // Evita que los errores de almacenamiento local rompan el chat.
    function readLocal(key, fallback = "") {
      try {
        return localStorage.getItem(key) ?? fallback;
      } catch (error) {
        console.warn("No se pudo leer el almacenamiento local.", error);
        return fallback;
      }
    }

    function saveLocal(key, value) {
      try {
        localStorage.setItem(key, value);
        return true;
      } catch (error) {
        console.error("No se pudo guardar " + key, error);
        return false;
      }
    }

    function removeLocal(key) {
      try {
        localStorage.removeItem(key);
      } catch (error) {
        console.warn("No se pudo borrar " + key, error);
      }
    }

    nameInput.value = readLocal("chatName");

    profilePhoto = readLocal("chatProfilePhoto");

    function status(text, error = false) {
      statusBox.textContent = text;
      statusBox.classList.toggle("error", error);
    }

    function isValidAvatar(value) {
      return (
        typeof value === "string" &&
        value.startsWith("data:image/jpeg;base64,") &&
        value.length <= MAX_AVATAR_LENGTH
      );
    }

    function setAvatar(element, name, photo) {
      element.onerror = () => {
        element.onerror = null;
        element.src = DEFAULT_AVATAR;
      };

      if (isValidAvatar(photo)) {
        element.src = photo;
        element.alt = "Foto de perfil de " + (name || "usuario");
      } else {
        element.src = DEFAULT_AVATAR;
        element.alt = "Avatar predeterminado de " + (name || "usuario");
      }
    }

    function updateProfile() {
      const name = nameInput.value.trim() || "Tu nombre";

      profileName.textContent = name;
      setAvatar(profilePreview, name, profilePhoto);
      setAvatar(currentAvatar, name, profilePhoto);
    }

    function applySettings() {
      const theme = readLocal("chatTheme", "dark");
      const color = readLocal("chatColor", "#6878f5");
      const background = readLocal("chatBackground", "plain");
      const bubbles = readLocal("chatBubbles", "normal");

      document.body.classList.toggle("light", theme === "light");

      themeButton.textContent =
        theme === "light" ? "🌙 Modo oscuro" : "☀️ Modo claro";

      document.documentElement.style.setProperty("--accent", color);

      messagesBox.classList.remove(
        "bg-gradient", "bg-dots",
        "bubbles-rounded", "bubbles-square"
      );

      if (background === "gradient" || background === "dots") {
        messagesBox.classList.add("bg-" + background);
      }

      if (bubbles === "rounded") {
        messagesBox.classList.add("bubbles-rounded");
      } else if (bubbles === "square") {
        messagesBox.classList.add("bubbles-square");
      }

      colorInput.value = color;
      backgroundSelect.value = background;
      bubbleSelect.value = bubbles;
    }

    themeButton.addEventListener("click", () => {
      const nextTheme =
        document.body.classList.contains("light") ? "dark" : "light";

      saveLocal("chatTheme", nextTheme);
      applySettings();
    });

    settingsButton.addEventListener("click", () => {
      const opening = settings.hidden;
      settings.hidden = !opening;

      settingsButton.setAttribute("aria-expanded", String(opening));
    });

    colorInput.addEventListener("input", () => {
      saveLocal("chatColor", colorInput.value);
      applySettings();
    });

    backgroundSelect.addEventListener("change", () => {
      saveLocal("chatBackground", backgroundSelect.value);
      applySettings();
    });

    bubbleSelect.addEventListener("change", () => {
      saveLocal("chatBubbles", bubbleSelect.value);
      applySettings();
    });

    nameInput.addEventListener("input", updateProfile);

    nameInput.addEventListener("change", () => {
      saveLocal("chatName", nameInput.value.trim());
      updateProfile();
    });

    photoInput.addEventListener("change", () => {
      const file = photoInput.files[0];
      if (!file) return;

      const allowedTypes = [
        "image/jpeg", "image/png", "image/webp"
      ];

      if (!allowedTypes.includes(file.type)) {
        status("Usá una imagen JPG, PNG o WebP.", true);
        photoInput.value = "";
        return;
      }

      if (file.size > 5 * 1024 * 1024) {
        status("La imagen supera el límite de 5 MB.", true);
        photoInput.value = "";
        return;
      }

      status("Procesando foto...");

      const reader = new FileReader();

      reader.onload = () => {
        const image = new Image();

        image.onload = () => {
          const canvas = document.createElement("canvas");
          canvas.width = AVATAR_SIZE;
          canvas.height = AVATAR_SIZE;

          const side = Math.min(image.width, image.height);
          const sx = (image.width - side) / 2;
          const sy = (image.height - side) / 2;

          const context = canvas.getContext("2d");

          if (!context) {
            status("No se pudo procesar la imagen.", true);
            return;
          }

          context.fillStyle = "#ffffff";
          context.fillRect(0, 0, AVATAR_SIZE, AVATAR_SIZE);

          context.drawImage(
            image, sx, sy, side, side,
            0, 0, AVATAR_SIZE, AVATAR_SIZE
          );

          const compressed = canvas.toDataURL("image/jpeg", 0.75);

          if (!isValidAvatar(compressed)) {
            status("La foto quedó demasiado pesada. Probá otra.", true);
            return;
          }

          // Se conserva la foto anterior si no se puede guardar la nueva.
          if (!saveLocal("chatProfilePhoto", compressed)) {
            status(
              "No se pudo guardar la foto en este navegador. " +
              "Liberá espacio y volvé a intentarlo.",
              true
            );
            return;
          }

          profilePhoto = compressed;
          updateProfile();
          photoInput.value = "";

          status(
            "Foto guardada. Se incluirá en tus próximos mensajes."
          );
        };

        image.onerror = () => {
          status("No se pudo abrir la imagen.", true);
        };

        image.src = reader.result;
      };

      reader.onerror = () => {
        status("No se pudo leer el archivo.", true);
      };

      reader.readAsDataURL(file);
    });

    document.getElementById("removePhoto").addEventListener("click", () => {
      removeLocal("chatProfilePhoto");

      profilePhoto = "";
      photoInput.value = "";

      updateProfile();

      status(
        "Foto quitada. Tus próximos mensajes irán sin foto."
      );
    });

    document.getElementById("resetSettings").addEventListener("click", () => {
      [
        "chatTheme",
        "chatColor",
        "chatBackground",
        "chatBubbles"
      ].forEach(removeLocal);

      applySettings();
      status("Personalización restablecida.");
    });

    // Evita duplicar mensajes recibidos por la carga inicial y Realtime.
    function showMessage(message) {
      if (!message || message.id == null) return;

      const existing = document.querySelector(
        "#messages [data-id='" +
        CSS.escape(String(message.id)) + "']"
      );

      if (existing) return;

      const item = document.createElement("article");
      item.className = "message";
      item.dataset.id = String(message.id);

      const avatar = document.createElement("img");
      avatar.className = "avatar";

      setAvatar(avatar, message.username, message.avatar);

      const body = document.createElement("div");
      body.className = "message-body";

      const name = document.createElement("strong");
      name.textContent = message.username || "Usuario";

      const content = document.createElement("p");
      content.textContent = message.content || "";

      body.append(name, content);
      item.append(avatar, body);
      messagesBox.appendChild(item);

      messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    async function loadMessages() {
      if (loadingMessages) return;

      loadingMessages = true;

      try {
        status("Recuperando mensajes guardados...");

        const { data, error } = await client
          .from("messages")
          .select("id, username, content, avatar, created_at")
          .order("created_at", { ascending: false })
          .limit(100);

        if (error) {
          status(
            "No se pudieron cargar los mensajes: " +
            error.message +
            ". Revisá los permisos de lectura de Supabase.",
            true
          );
          return;
        }

        // Se muestran del más antiguo al más reciente.
        (data || []).reverse().forEach(showMessage);

        if (!data || data.length === 0) {
          status(
            "Conectado, pero Supabase no devolvió mensajes. " +
            "Comprobá si la tabla tiene datos y permite leerlos."
          );
        } else {
          status(
            "Se recuperaron " + data.length +
            " mensajes guardados."
          );
        }
      } finally {
        loadingMessages = false;
      }
    }

    async function start() {
      if (!window.supabase) {
        status(
          "No se pudo cargar Supabase. Revisá tu conexión e intentá recargar.",
          true
        );
        return;
      }

      if (!URL_SUPABASE || !CLAVE_PUBLICA.startsWith("sb_publishable_")) {
        status("Revisá la URL y la clave pública de Supabase.", true);
        return;
      }

      client = window.supabase.createClient(
        URL_SUPABASE,
        CLAVE_PUBLICA
      );

      // Carga inicial desde la base de datos.
      await loadMessages();

      // Escucha los mensajes nuevos guardados en Supabase.
      channel = client
        .channel("chat-publico")
        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "messages"
          },
          payload => {
            showMessage(payload.new);
            status("Mensaje nuevo recibido.");
          }
        )
        .subscribe(state => {
          if (state === "SUBSCRIBED") {
            status("Conectado. ¡Ya podés hablar!");
          } else if (
            state === "CHANNEL_ERROR" ||
            state === "TIMED_OUT" ||
            state === "CLOSED"
          ) {
            status(
              "Error en tiempo real: " + state +
              ". Los mensajes guardados se pueden recuperar al recargar.",
              true
            );
          }
        });

      // Solo se registra una vez el evento de envío.
      form.addEventListener("submit", sendMessage);
    }

    async function sendMessage(event) {
      event.preventDefault();

      if (!client) {
        status("El chat todavía no está conectado.", true);
        return;
      }

      const username = nameInput.value.trim();
      const content = input.value.trim();

      if (!username || !content) {
        status("Escribí tu nombre y un mensaje.", true);
        return;
      }

      const row = { username, content };

      if (isValidAvatar(profilePhoto)) {
        row.avatar = profilePhoto;
      }

      sendButton.disabled = true;

      try {
        saveLocal("chatName", username);
        updateProfile();

        // Inserta el mensaje en la base de datos.
        const { error } = await client
          .from("messages")
          .insert(row);

        if (error) {
          status(
            "No se pudo guardar el mensaje: " +
            error.message +
            ". Revisá los permisos de escritura de Supabase.",
            true
          );
          return;
        }

        input.value = "";

        // Recupera el mensaje desde la base de datos.
        // También funciona si Realtime tarda en responder.
        const { data, error: reloadError } = await client
          .from("messages")
          .select("id, username, content, avatar, created_at")
          .order("created_at", { ascending: false })
          .limit(100);

        if (!reloadError && data) {
          data.reverse().forEach(showMessage);
        }

        input.focus();
        status("Mensaje guardado en Supabase.");
      } catch (error) {
        status("Error al enviar: " + error.message, true);
      } finally {
        sendButton.disabled = false;
      }
    }

    applySettings();
    updateProfile();

    start().catch(error => {
      status("Error al iniciar: " + error.message, true);
      console.error("Error al iniciar el chat:", error);
    });
  </script>
</body>
</html>
