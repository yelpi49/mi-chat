
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Chat Público</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px;
      background: #10131c; color: #f1f5f9;
      font-family: Arial, sans-serif;
      display: grid; place-items: center; min-height: 100vh;
    }
    .chat {
      width: 100%; max-width: 650px; height: 85vh;
      display: flex; flex-direction: column;
      background: #1b2030; border: 1px solid #343b50;
      border-radius: 16px; overflow: hidden;
    }
    header { padding: 18px; background: #242b40; }
    h1 { margin: 0 0 6px; font-size: 23px; }
    header p { margin: 0; color: #aab5ca; }
    #status { font-size: 13px; margin-top: 8px; color: #aab5ca; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; }
    .message { margin-bottom: 15px; overflow-wrap: anywhere; }
    .message strong { color: #a9b4ff; }
    .message p { margin: 5px 0 0; white-space: pre-wrap; }
    .controls { padding: 12px; border-top: 1px solid #343b50; }
    form { display: flex; gap: 8px; margin-top: 8px; }
    input {
      min-width: 0; width: 100%; padding: 12px;
      border: 1px solid #424b64; border-radius: 9px;
      background: #101522; color: white; font-size: 15px;
    }
    button {
      padding: 0 16px; border: 0; border-radius: 9px;
      background: #6878f5; color: white;
      font-weight: bold; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: wait; }
    #status.error { color: #ffaaaa; }
  </style>
</head>
<body>
  <main class="chat">
    <header>
      <h1>💬 Mi Chat</h1>
      <p>Un lugar para hablar con todos</p>
      <div id="status">Conectando...</div>
    </header>

    <section id="messages" aria-live="polite"></section>

    <div class="controls">
      <input id="username" maxlength="24"
        placeholder="Tu nombre" autocomplete="nickname">
      <form id="chatForm">
        <input id="messageInput" maxlength="500"
          placeholder="Escribí un mensaje..."
          autocomplete="off" required>
        <button id="sendButton" type="submit">Enviar</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const URL_SUPABASE = "https://xluskazgonjpchcgdzii.supabase.co";
    const CLAVE_PUBLICA = "PEGA_AQUI_TU_CLAVE_SB_PUBLISHABLE";

    const statusBox = document.getElementById("status");
    const messagesBox = document.getElementById("messages");
    const nameInput = document.getElementById("username");
    const input = document.getElementById("messageInput");
    const form = document.getElementById("chatForm");
    const sendButton = document.getElementById("sendButton");

    nameInput.value = localStorage.getItem("chatName") || "";

    function status(text, error = false) {
      statusBox.textContent = text;
      statusBox.classList.toggle("error", error);
    }

    function showMessage(message) {
      if (messagesBox.querySelector('[data-id="' + message.id + '"]')) return;

      const item = document.createElement("article");
      item.className = "message";
      item.dataset.id = message.id;

      const name = document.createElement("strong");
      name.textContent = message.username;

      const content = document.createElement("p");
      content.textContent = message.content;

      item.append(name, content);
      messagesBox.appendChild(item);
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    async function start() {
      if (!window.supabase) {
        status("No se pudo cargar la biblioteca. Recargá la página.", true);
        return;
      }
      if (CLAVE_PUBLICA === "https://xluskazgonjpchcgdzii.supabase.co/") {
        status("sb_publishable_pWiC1tR_43vVjF0snbXeBA_tTp-0pmk", true);
        return;
      }

      const client = window.supabase.createClient(
        URL_SUPABASE, CLAVE_PUBLICA
      );

      const { data, error } = await client
        .from("messages")
        .select("id, username, content, created_at")
        .order("id", { ascending: true })
        .limit(100);

      if (error) {
        status("Error al cargar mensajes: " + error.message, true);
        return;
      }

      data.forEach(showMessage);

      client.channel("chat-publico")
        .on("postgres_changes", {
          event: "INSERT",
          schema: "public",
          table: "messages"
        }, payload => showMessage(payload.new))
        .subscribe((state) => {
          if (state === "SUBSCRIBED") {
            status("Conectado. ¡Ya podés hablar!");
          } else if (state === "CHANNEL_ERROR" || state === "TIMED_OUT") {
            status("Error de conexión en tiempo real. Recargá la página.", true);
          }
        });

      form.addEventListener("submit", async event => {
        event.preventDefault();

        const username = nameInput.value.trim();
        const content = input.value.trim();

        if (!username || !content) {
          status("Escribí tu nombre y un mensaje.", true);
          return;
        }

        localStorage.setItem("chatName", username);
        sendButton.disabled = true;

        const { error: sendError } = await client
          .from("messages")
          .insert({ username, content });

        sendButton.disabled = false;

        if (sendError) {
          status("No se pudo enviar: " + sendError.message, true);
          return;
        }

        input.value = "";
        input.focus();
        status("Mensaje enviado.");
      });
    }

    start().catch(error => {
      status("Error: " + error.message, true);
    });
  </script>
</body>
</html>
