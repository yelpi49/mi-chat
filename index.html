<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Chat Público</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --accent: #6878f5;
      --page: #10131c;
      --panel: #1b2030;
      --header: #242b40;
      --border: #343b50;
      --text: #f1f5f9;
      --muted: #aab5ca;
      --input-bg: #101522;
      --bubble: #292f43;
    }

    body.light {
      --page: #edf1f8;
      --panel: #ffffff;
      --header: #e1e8f5;
      --border: #ccd4e3;
      --text: #20283a;
      --muted: #5c667a;
      --input-bg: #ffffff;
      --bubble: #e9edf7;
    }

    body {
      margin: 0;
      padding: 12px;
      background: var(--page);
      color: var(--text);
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      transition: background .2s, color .2s;
    }

    body.bg-gradient {
      background: linear-gradient(135deg, #10131c, #292b52, #162c43);
    }

    body.light.bg-gradient {
      background: linear-gradient(135deg, #edf1f8, #dce4ff, #d5eff5);
    }

    body.bg-dots {
      background-image: radial-gradient(var(--border) 1px, transparent 1px);
      background-size: 18px 18px;
    }

    .chat {
      position: relative;
      width: 100%;
      max-width: 650px;
      height: 90vh;
      height: 90dvh;
      min-height: 400px;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    header {
      padding: 14px;
      background: var(--header);
      flex-shrink: 0;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 22px;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    #status {
      font-size: 12px;
      margin-top: 8px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    #status.error { color: #ff7777; }

    .top-actions, .room-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    button, input, select { font: inherit; }

    button {
      padding: 10px 12px;
      border: 0;
      border-radius: 9px;
      background: var(--accent);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    button.secondary {
      background: var(--bubble);
      color: var(--text);
      border: 1px solid var(--border);
    }

    input, select {
      width: 100%;
      min-width: 0;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--input-bg);
      color: var(--text);
    }

    input[type="color"] {
      height: 42px;
      padding: 4px;
    }

    input[type="file"] { font-size: 12px; }

    /* MENÚ FLOTANTE DE SALAS */
    #roomPanel {
      position: absolute;
      z-index: 20;
      top: 125px;
      bottom: 78px;
      left: 10px;
      right: 10px;

      padding: 14px;
      display: grid;
      align-content: start;
      gap: 12px;

      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, .4);

      overflow-y: auto;
      max-height: none;
    }

    #roomPanel[hidden] {
      display: none !important;
    }

    .room-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .room-heading h2 {
      font-size: 18px;
      margin: 0;
    }

    .room-card {
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bubble);
    }

    .room-card.active {
      border-color: var(--accent);
    }

    .room-card-info {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .room-card-info strong {
      display: block;
      margin-bottom: 4px;
    }

    .room-card-info small {
      color: var(--muted);
    }

    .room-card button {
      flex-shrink: 0;
    }

    .setting {
      display: grid;
      gap: 6px;
    }

    .setting label, .setting-title {
      font-size: 14px;
      font-weight: bold;
    }

    .setting small {
      color: var(--muted);
      line-height: 1.4;
    }

    #settings {
      padding: 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: grid;
      gap: 12px;
      max-height: 40vh;
      overflow-y: auto;
      flex-shrink: 0;
    }

    #settings[hidden] {
      display: none !important;
    }

    .profile-preview {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      min-width: 38px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--accent);
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      overflow: hidden;
    }

    .avatar.large {
      width: 64px;
      height: 64px;
      min-width: 64px;
      font-size: 20px;
    }

    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-wrap: anywhere;
    }

    .message {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      max-width: 100%;
    }

    .message-content {
      min-width: 0;
      max-width: calc(100% - 45px);
    }

    .message-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 7px;
      margin-bottom: 4px;
    }

    .message-meta strong {
      font-size: 13px;
    }

    .message-meta small {
      color: var(--muted);
      font-size: 11px;
    }

    .bubble {
      background: var(--bubble);
      border: 1px solid var(--border);
      border-radius: 4px 13px 13px 13px;
      padding: 10px 12px;
      line-height: 1.4;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.own .bubble {
      border-color: var(--accent);
    }

    #emptyState {
      margin: auto;
      text-align: center;
      color: var(--muted);
      line-height: 1.5;
      padding: 20px;
    }

    #composer {
      padding: 12px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--header);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    #messageInput {
      flex: 1;
      min-height: 43px;
      max-height: 120px;
      resize: vertical;
    }

    #sendButton {
      min-height: 43px;
    }

    #currentRoom {
      font-size: 12px;
      color: var(--muted);
      margin-top: 5px;
      overflow-wrap: anywhere;
    }

    .notice {
      padding: 9px;
      border-radius: 8px;
      background: var(--bubble);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    @media (max-width: 480px) {
      body { padding: 0; }

      .chat {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        border-radius: 0;
        border: 0;
      }

      header { padding: 12px; }

      #roomPanel {
        top: 115px;
        bottom: 72px;
      }

      #messages { padding: 11px; }

      #composer { padding: 9px; }

      button { padding: 10px; }
    }
  </style>
</head
