<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Chat Público</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{--accent:#6878f5;--page:#10131c;--panel:#1b2030;--header:#242b40;--border:#343b50;--text:#f1f5f9;--muted:#aab5ca;--input-bg:#101522;--bubble:#292f43;--danger:#ff7777}
body.light{--page:#edf1f8;--panel:#fff;--header:#e1e8f5;--border:#ccd4e3;--text:#20283a;--muted:#5c667a;--input-bg:#fff;--bubble:#e9edf7;--danger:#c62828}
body{margin:0;padding:16px;background:var(--page);color:var(--text);font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh;min-height:100dvh;transition:background .2s,color .2s}
.chat{width:100%;max-width:650px;height:94vh;height:calc(100dvh - 32px);min-height:420px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden}
header{padding:16px;background:var(--header);flex-shrink:0}
h1{margin:0 0 6px;font-size:23px}
header p{margin:0;color:var(--muted)}
#accountInfo{font-size:13px;margin-top:8px;color:var(--muted);overflow-wrap:anywhere}
#status{font-size:13px;margin-top:8px;color:var(--muted)}
#status.error{color:var(--danger)}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button,select,input{font:inherit}
button{padding:10px 14px;border:0;border-radius:9px;background:var(--accent);color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
button.secondary{background:var(--bubble);color:var(--text);border:1px solid var(--border)}
#settings
