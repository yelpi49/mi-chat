
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Chat Público</title>
<style>
*{box-sizing:border-box}
:root{--accent:#6878f5;--page:#10131c;--panel:#1b2030;--header:#242b40;--border:#343b50;--text:#f1f5f9;--muted:#aab5ca;--input-bg:#101522;--bubble:#292f43}
body.light{--page:#edf1f8;--panel:#fff;--header:#e1e8f5;--border:#ccd4e3;--text:#20283a;--muted:#5c667a;--input-bg:#fff;--bubble:#e9edf7}
body{margin:0;padding:16px;background:var(--page);color:var(--text);font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}
.chat{width:100%;max-width:650px;height:94vh;min-height:420px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden}
header{padding:16px;background:var(--header)}
h1{margin:0 0 6px;font-size:23px}
header p{margin:0;color:var(--muted)}
#status{font-size:13px;margin-top:8px;color:var(--muted)}
#status.error{color:#ff7777}
.top-actions,.auth-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button,select,input{font:inherit}
button{padding:10px 14px;border:0;border-radius:9px;background:var(--accent);color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
button.secondary{background:var(--bubble);color:var(--text);border:1px solid var(--border)}
#settings{padding:14px;background:var(--panel);border-bottom:1px solid var(--border);display:grid;gap:12px;max-height:40vh;overflow-y:auto}
#settings[hidden], [hidden]{display:none!important}
.setting{display:grid;gap:6px}
.setting label,.setting-title{font-size:14px;font-weight:bold}
.setting small,.hint{color:var(--muted);line-height:1.4;font-size:12px}
input,select{min-width:0;width:100%;padding:11px;border:1px solid var(--border);border-radius:9px;background:var(--input-bg);color:var(--text)}
input[type=color]{height:44px;padding:4px;cursor:pointer}
input[type=file]{font-size:13px}
.profile-preview{display:flex;align-items:center;gap:12px}
.avatar{width:38px;height:38px;min-width:38px;border-radius:50%;object-fit:cover;background:var(--accent);color:white;display:inline-flex;align-items:center;justify-content:center;font-weight:bold;overflow:hidden}
.avatar.large{width:64px;height:64px;min-width:64px;font-size:20px}
#messages{flex:1;overflow-y:auto;padding:16px}
#messages.bg-gradient{background-image:linear-gradient(135deg,color-mix(in srgb,var(--accent) 10%,transparent),transparent 65%)}
#messages.bg-dots{background-image:radial-gradient(color-mix(in srgb,var(--muted) 25%,transparent) 1px,transparent 1px);background-size:18px 18px}
.message{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;overflow-wrap:anywhere}
.message-body{min-width:0;max-width:calc(100% - 48px);padding:10px 12px;border-radius:12px;background:var(--bubble);border:1px solid var(--border)}
.message strong{color:var(--accent);overflow-wrap:anywhere}
.message p{margin:5px 0 0;white-space:pre-wrap;line-height:1.4}
#messages.bubbles-rounded .message-body{border-radius:22px}
#messages.bubbles-square .message-body{border-radius:4px}
.controls{padding:12px;border-top:1px solid var(--border)}
#profileLine{display:flex;align-items:center;gap:9px;margin-bottom:8px}
#profileLine .avatar{width:32px;height:32px;min-width:32px}
form{display:flex;gap:8px;margin-top:8px}
#messageInput{flex:1}
#authPanel{padding:12px 14px;border-bottom:1px solid var(--border);display:grid;gap:9px}
#authPanel h2{font-size:16px;margin:0}
.auth-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.auth-grid .wide{grid-column:1/-1}
.auth-actions button{flex:1}
#accountInfo{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
@media(max-width:480px){
body{padding:6px}
.chat{height:96vh;min-height:350px;border-radius:12px}
header{padding:13px}
h1{font-size:21px}
#messages{padding:12px}
.controls{padding:9px}
form{gap:6px}
form button{padding:0 12px}
.auth-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<main class="chat">
<header>
<h1>💬 Mi Chat</h1>
<p>Un lugar para hablar con todos</p>
<div id="status">Conectando...</div>
<div class="top-actions">
<button id="themeButton" type="button">☀️ Modo claro</button>
<button id="settingsButton" class="secondary" type="button" aria-expanded="false">⚙️ Personalizar</button>
</div>
</header>

<section id="settings" hidden>
<div class="setting">
<span class="setting-title">Tu perfil</span>
<div class="profile-preview">
<img id="profilePreview" class="avatar large" alt="Tu foto de perfil">
<div>
<strong id="profileName">Tu nombre</strong>
<small style="display:block">Tu foto se comparte con los demás usuarios.</small>
</div>
</div>
</div>
<div class="setting">
<label for="photoInput">📸 Foto de perfil</label>
<input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp">
<small>JPG, PNG o WebP. Máximo 5 MB.</small>
<button id="removePhoto" type="button" class="secondary">Quitar foto</button>
</div>
<div class="setting">
<label for="colorInput">🎨 Color principal</label>
<input id="colorInput" type="color" value="#6878f5">
</div>
<div class="setting">
<label for="backgroundSelect">🖼️ Fondo del chat</label>
<select id="backgroundSelect">
<option value="plain">Simple</option>
<option value="gradient">Degradado</option>
<option value="dots">Puntos</option>
</select>
</div>
<div class="setting">
<label for="bubbleSelect">💬 Estilo de burbujas</label>
<select id="bubbleSelect">
<option value="normal">Normal</option>
<option value="rounded">Redondeadas</option>
<option value="square">Cuadradas</option>
</select>
</div>
<button id="resetSettings" type="button" class="secondary">Restablecer personalización</button>
</section>

<section id="authPanel">
<h2>🔐 Tu cuenta</h2>
<div id="accountInfo">Iniciá sesión o creá una cuenta para participar.</div>
<div id="authFields" class="auth-grid">
<input id="emailInput" class="wide" type="email" placeholder="Correo electrónico" autocomplete="email">
<input id="passwordInput" class="wide" type="password" placeholder="Contraseña (mínimo 6 caracteres)" autocomplete="current-password">
<input id="signupName" class="wide" maxlength="24" placeholder="Nombre para mostrar (para registrarte)" autocomplete="nickname">
</div>
<div class="auth-actions" id="authButtons">
<button id="loginButton" type="button">Iniciar sesión</button>
<button id="signupButton" type="button" class="secondary">Crear cuenta</button>
</div>
<button id="logoutButton" type="button" class="secondary" hidden>Cerrar sesión</button>
<div class="hint">Si el registro requiere confirmar el correo, revisá tu bandeja de entrada.</div>
</section>

<section id="messages" aria-live="polite"></section>

<div class="controls">
<div id="profileLine">
<img id="currentAvatar" class="avatar" alt="Tu foto de perfil">
<input id="username" maxlength="24" placeholder="Tu nombre" autocomplete="nickname" disabled>
</div>
<form id="chatForm">
<input id="messageInput" maxlength="500" placeholder="Iniciá sesión para escribir..." autocomplete="off" required disabled>
<button id="sendButton" type="submit" disabled>Enviar</button>
</form>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL_SUPABASE = "https://xluskazgonjpchcgdzii.supabase.co";
const CLAVE_PUBLICA = "sb_publishable_pWiC1tR_43vVjF0snbXeBA_tTp-0pmk";

const $ = id => document.getElementById(id);
const statusBox = $("status");
const messagesBox = $("messages");
const nameInput = $("username");
const input = $("messageInput");
const form = $("chatForm");
const sendButton = $("sendButton");
const settings = $("settings");
const settingsButton = $("settingsButton");
const themeButton = $("themeButton");
const colorInput = $("colorInput");
const backgroundSelect = $("backgroundSelect");
const bubbleSelect = $("bubbleSelect");
const photoInput = $("photoInput");
const profilePreview = $("profilePreview");
const currentAvatar = $("currentAvatar");
const profileName = $("profileName");
const emailInput = $("emailInput");
const passwordInput = $("passwordInput");
const signupName = $("signupName");
const loginButton = $("loginButton");
const signupButton = $("signupButton");
const logoutButton = $("logoutButton");
const accountInfo = $("accountInfo");
const authFields = $("authFields");
const authButtons = $("authButtons");

const DEFAULT_AVATAR =
  "data:image/svg+xml;charset=UTF-8," +
  encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80">' +
    '<rect width="80" height="80" rx="40" fill="#6878f5"/>' +
    '<text x="40" y="53" text-anchor="middle" font-size="38" fill="white">?</text>' +
    '</svg>'
  );

let client = null;
let currentUser = null;
let profilePhoto = "";
let profilesById = {};
let profileChannel = null;
let messageChannel = null;

function status(text, error = false) {
  statusBox.textContent = text;
  statusBox.classList.toggle("error", error);
}

function setAvatar(element, name, photo) {
  element.onerror = () => {
    element.onerror = null;
    element.src = DEFAULT_AVATAR;
  };
  element.src = photo || DEFAULT_AVATAR;
  element.alt = photo
    ? "Foto de perfil de " + name
    : "Avatar predeterminado de " + name;
}

function updateProfile() {
  const name = nameInput.value.trim() || "Tu nombre";
  profileName.textContent = name;
  setAvatar(profilePreview, name, profilePhoto);
  setAvatar(currentAvatar, name, profilePhoto);
}

function applySettings() {
  const theme = localStorage.getItem("chatTheme") || "dark";
  const color = localStorage.getItem("chatColor") || "#6878f5";
  const background = localStorage.getItem("chatBackground") || "plain";
  const bubbles = localStorage.getItem("chatBubbles") || "normal";

  document.body.classList.toggle("light", theme === "light");
  themeButton.textContent =
    theme === "light" ? "🌙 Modo oscuro" : "☀️ Modo claro";

  document.documentElement.style.setProperty("--accent", color);
  messagesBox.classList.remove(
    "bg-gradient", "bg-dots", "bubbles-rounded", "bubbles-square"
  );

  if (background !== "plain") {
    messagesBox.classList.add("bg-" + background);
  }
  if (bubbles === "rounded") {
    messagesBox.classList.add("bubbles-rounded");
  } else if (bubbles === "square") {
    messagesBox.classList.add("bubbles-square");
  }

  colorInput.value = color;
  backgroundSelect.value = background;
  bubbleSelect.value = bubbles;
}

themeButton.addEventListener("click", () => {
  const next = document.body.classList.contains("light") ? "dark" : "light";
  localStorage.setItem("chatTheme", next);
  applySettings();
});

settingsButton.addEventListener("click", () => {
  const opening = settings.hidden;
  settings.hidden = !opening;
  settingsButton.setAttribute("aria-expanded", String(opening));
});

colorInput.addEventListener("input", () => {
  localStorage.setItem("chatColor", colorInput.value);
  applySettings();
});

backgroundSelect.addEventListener("change", () => {
  localStorage.setItem("chatBackground", backgroundSelect.value);
  applySettings();
});

bubbleSelect.addEventListener("change", () => {
  localStorage.setItem("chatBubbles", bubbleSelect.value);
  applySettings();
});

nameInput.addEventListener("input", updateProfile);

$("resetSettings").addEventListener("click", () => {
  ["chatTheme", "chatColor", "chatBackground", "chatBubbles"]
    .forEach(key => localStorage.removeItem(key));
  applySettings();
  status("Personalización restablecida.");
});

function updateAuthUI() {
  const loggedIn = !!currentUser;
  authFields.hidden = loggedIn;
  authButtons.hidden = loggedIn;
  logoutButton.hidden = !loggedIn;
  nameInput.disabled = !loggedIn;
  photoInput.disabled = !loggedIn;
  $("removePhoto").disabled = !loggedIn;
  input.disabled = !loggedIn;
  sendButton.disabled = !loggedIn;

  if (loggedIn) {
    accountInfo.textContent = "Sesión iniciada: " + currentUser.email;
    input.placeholder = "Escribí un mensaje...";
    nameInput.placeholder = "Tu nombre";
  } else {
    accountInfo.textContent = "Iniciá sesión o creá una cuenta para participar.";
    input.placeholder = "Iniciá sesión para escribir...";
    nameInput.value = "";
    profilePhoto = "";
    updateProfile();
  }
}

async function loadProfile() {
  if (!currentUser) return;

  const { data, error } = await client
    .from("profiles")
    .select("id,username,avatar_url")
    .eq("id", currentUser.id)
    .maybeSingle();

  if (error) throw error;

  let profile = data;

  if (!profile) {
    const suggested = (
      signupName.value.trim() ||
      currentUser.email?.split("@")[0] ||
      "Usuario"
    ).slice(0, 24);

    const { data: created, error: createError } = await client
      .from("profiles")
      .upsert({
        id: currentUser.id,
        username: suggested,
        avatar_url: null
      }, { onConflict: "id" })
      .select("id,username,avatar_url")
      .single();

    if (createError) throw createError;
    profile = created;
  }

  nameInput.value = profile.username || "";
  profilePhoto = profile.avatar_url || "";
  profilesById[currentUser.id] = profile;
  updateProfile();
}

async function refreshProfiles(userIds) {
  const ids = [...new Set(userIds.filter(Boolean))];
  if (!ids.length) return;

  const { data, error } = await client
    .from("profiles")
    .select("id,username,avatar_url")
    .in("id", ids);

  if (error) {
    console.warn("No se pudieron cargar los perfiles:", error.message);
    return;
  }

  for (const profile of data || []) {
    profilesById[profile.id] = profile;
  }
}

function showMessage(message) {
  const key = String(message.id);
  const existing = [...messagesBox.children].find(
    el => el.dataset.id === key
  );

  const profile = profilesById[message.user_id];
  const displayName =
    profile?.username || message.username || "Usuario";

  if (existing) {
    const avatar = existing.querySelector(".avatar");
    const name = existing.querySelector("strong");

    if (avatar) setAvatar(avatar, displayName, profile?.avatar_url || "");
    if (name) name.textContent = displayName;
    return;
  }

  const item = document.createElement("article");
  item.className = "message";
  item.dataset.id = key;

  const avatar = document.createElement("img");
  avatar.className = "avatar";
  setAvatar(avatar, displayName, profile?.avatar_url || "");

  const body = document.createElement("div");
  body.className = "message-body";

  const name = document.createElement("strong");
  name.textContent = displayName;

  const content = document.createElement("p");
  content.textContent = message.content;

  body.append(name, content);
  item.append(avatar, body);
  messagesBox.appendChild(item);
  messagesBox.scrollTop = messagesBox.scrollHeight;
}

async function renderMessages() {
  const { data, error } = await client
    .from("messages")
    .select("id,user_id,username,content,created_at")
    .order("id", { ascending: true })
    .limit(100);

  if (error) throw error;

  await refreshProfiles((data || []).map(message => message.user_id));

  messagesBox.replaceChildren();
  (data || []).forEach(showMessage);
}

async function ensureProfileName(newName) {
  const clean = newName.trim();

  if (clean.length < 2 || clean.length > 24) {
    throw new Error("El nombre debe tener entre 2 y 24 caracteres.");
  }

  const { data, error } = await client
    .from("profiles")
    .update({
      username: clean,
      updated_at: new Date().toISOString()
    })
    .eq("id", currentUser.id)
    .select("id,username,avatar_url")
    .single();

  if (error) throw error;

  nameInput.value = data.username;
  profilePhoto = data.avatar_url || "";
  profilesById[currentUser.id] = data;
  updateProfile();

  return data;
}

loginButton.addEventListener("click", async () => {
  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email || !password) {
    status("Ingresá tu correo y contraseña.", true);
    return;
  }

  loginButton.disabled = true;

  try {
    const { data, error } = await client.auth.signInWithPassword({
      email, password
    });
    if (error) throw error;

    currentUser = data.user;
    await loadProfile();
    updateAuthUI();
    await renderMessages();
    status("Sesión iniciada. ¡Ya podés chatear!");
  } catch (error) {
    status("No se pudo iniciar sesión: " + error.message, true);
  } finally {
    loginButton.disabled = false;
  }
});

signupButton.addEventListener("click", async () => {
  const email = emailInput.value.trim();
  const password = passwordInput.value;
  const username = signupName.value.trim();

  if (!email || !password || !username) {
    status("Completá correo, contraseña y nombre.", true);
    return;
  }
  if (password.length < 6) {
    status("La contraseña debe tener al menos 6 caracteres.", true);
    return;
  }
  if (username.length < 2 || username.length > 24) {
    status("El nombre debe tener entre 2 y 24 caracteres.", true);
    return;
  }

  signupButton.disabled = true;

  try {
    const { data, error } = await client.auth.signUp({
      email,
      password,
      options: { emailRedirectTo: location.origin + location.pathname }
    });
    if (error) throw error;

    if (data.session && data.user) {
      currentUser = data.user;

      const { error: profileError } = await client
        .from("profiles")
        .upsert({
          id: currentUser.id,
          username,
          avatar_url: null
        }, { onConflict: "id" });

      if (profileError) throw profileError;

      await loadProfile();
      updateAuthUI();
      await renderMessages();
      status("Cuenta creada. ¡Bienvenido al chat!");
    } else {
      status("Cuenta creada. Revisá tu correo para confirmar la cuenta y después iniciá sesión.");
    }
  } catch (error) {
    status("No se pudo crear la cuenta: " + error.message, true);
  } finally {
    signupButton.disabled = false;
  }
});

logoutButton.addEventListener("click", async () => {
  const { error } = await client.auth.signOut();

  if (error) {
    status("No se pudo cerrar sesión: " + error.message, true);
    return;
  }

  currentUser = null;
  profilesById = {};
  messagesBox.replaceChildren();
  updateAuthUI();
  status("Sesión cerrada.");
});

nameInput.addEventListener("change", async () => {
  if (!currentUser) return;

  try {
    await ensureProfileName(nameInput.value);
    await renderMessages();
    status("Nombre de perfil actualizado.");
  } catch (error) {
    status("No se pudo cambiar el nombre: " + error.message, true);
    try { await loadProfile(); } catch (_) {}
  }
});

function fileToCompressedJpeg(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("No se pudo leer la imagen."));

    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("No se pudo abrir la imagen."));

      img.onload = () => {
        const canvas = document.createElement("canvas");
        const max = 256;
        const scale = Math.min(1, max / Math.max(img.width, img.height));

        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));

        const ctx = canvas.getContext("2d");
        if (!ctx) {
          reject(new Error("No se pudo procesar la imagen."));
          return;
        }

        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => {
          if (blob) resolve(blob);
          else reject(new Error("No se pudo procesar la imagen."));
        }, "image/jpeg", 0.8);
      };

      img.src = reader.result;
    };

    reader.readAsDataURL(file);
  });
}

photoInput.addEventListener("change", async () => {
  const file = photoInput.files?.[0];
  if (!file || !currentUser) return;

  if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
    status("Usá una imagen JPG, PNG o WebP.", true);
    photoInput.value = "";
    return;
  }
  if (file.size > 5 * 1024 * 1024) {
    status("La imagen supera el límite de 5 MB.", true);
    photoInput.value = "";
    return;
  }

  try {
    status("Subiendo foto...");

    const blob = await fileToCompressedJpeg(file);
    const path = currentUser.id + "/avatar.jpg";

    const { error: uploadError } = await client.storage
      .from("avatars")
      .upload(path, blob, {
        contentType: "image/jpeg",
        upsert: true,
        cacheControl: "0"
      });

    if (uploadError) throw uploadError;

    const { data: urlData } = client.storage
      .from("avatars")
      .getPublicUrl(path);

    const freshPhotoUrl =
      urlData.publicUrl + "?v=" + Date.now();

    const { data, error } = await client
      .from("profiles")
      .update({
        avatar_url: freshPhotoUrl,
        updated_at: new Date().toISOString()
      })
      .eq("id", currentUser.id)
      .select("id,username,avatar_url")
      .single();

    if (error) throw error;

    profilePhoto = data.avatar_url || "";
    profilesById[currentUser.id] = data;
    updateProfile();
    await renderMessages();
    status("Foto de perfil compartida y guardada.");
  } catch (error) {
    status("No se pudo subir la foto: " + error.message, true);
  } finally {
    photoInput.value = "";
  }
});

$("removePhoto").addEventListener("click", async () => {
  if (!currentUser) return;

  try {
    const { error: removeError } = await client.storage
      .from("avatars")
      .remove([currentUser.id + "/avatar.jpg"]);

    if (removeError) throw removeError;

    const { data, error } = await client
      .from("profiles")
      .update({
        avatar_url: null,
        updated_at: new Date().toISOString()
      })
      .eq("id", currentUser.id)
      .select("id,username,avatar_url")
      .single();

    if (error) throw error;

    profilePhoto = "";
    profilesById[currentUser.id] = data;
    updateProfile();
    await renderMessages();
    status("Foto de perfil eliminada.");
  } catch (error) {
    status("No se pudo quitar la foto: " + error.message, true);
  }
});

form.addEventListener("submit", async event => {
  event.preventDefault();

  if (!currentUser) {
    status("Iniciá sesión para enviar mensajes.", true);
    return;
  }

  const username = nameInput.value.trim();
  const content = input.value.trim();

  if (!username || !content) {
    status("Escribí tu nombre y un mensaje.", true);
    return;
  }

  sendButton.disabled = true;

  try {
    await ensureProfileName(username);

    const { error } = await client.from("messages").insert({
      user_id: currentUser.id,
      username,
      content
    });

    if (error) throw error;

    input.value = "";
    input.focus();
    status("Mensaje enviado.");
  } catch (error) {
    status("No se pudo enviar: " + error.message, true);
  } finally {
    sendButton.disabled = false;
  }
});

async function start() {
  if (!window.supabase) {
    status("No se pudo cargar Supabase. Recargá la página.", true);
    return;
  }

  client = window.supabase.createClient(URL_SUPABASE, CLAVE_PUBLICA);
  applySettings();
  updateProfile();

  try {
    const { data, error } = await client.auth.getSession();
    if (error) throw error;

    currentUser = data.session?.user || null;

    if (currentUser) await loadProfile();
    updateAuthUI();
    await renderMessages();

    client.auth.onAuthStateChange((_event, session) => {
      currentUser = session?.user || null;
    });

    profileChannel = client.channel("perfiles-en-tiempo-real")
      .on("postgres_changes", {
        event: "*",
        schema: "public",
        table: "profiles"
      }, async payload => {
        const profile = payload.new;

        if (profile?.id) {
          profilesById[profile.id] = profile;

          if (currentUser && profile.id === currentUser.id) {
            profilePhoto = profile.avatar_url || "";
            if (nameInput.value !== profile.username) {
              nameInput.value = profile.username || "";
            }
            updateProfile();
          }
        }

        try {
          await renderMessages();
        } catch (error) {
          console.warn("No se pudieron actualizar los mensajes:", error);
        }
      })
      .subscribe();

    messageChannel = client.channel("chat-publico")
      .on("postgres_changes", {
        event: "INSERT",
        schema: "public",
        table: "messages"
      }, async payload => {
        await refreshProfiles([payload.new.user_id]);
        showMessage(payload.new);
      })
      .subscribe(state => {
        if (state === "SUBSCRIBED") {
          status(currentUser
            ? "Conectado. ¡Ya podés hablar!"
            : "Conectado. Iniciá sesión para chatear.");
        } else if (state === "CHANNEL_ERROR" || state === "TIMED_OUT") {
          status("Error de conexión en tiempo real. Revisá la configuración de Supabase.", true);
        }
      });

  } catch (error) {
    status("Error al iniciar el chat: " + error.message, true);
  }
}

start();
</script>
</body>
</html>
